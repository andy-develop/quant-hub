name: strategy-pm

# 短线/个性化策略链路（盘后，方案 §4.2 strategy-pm / §13.2）。
# 短线：检出 quant-lab（已 commit data/kline + 部分 data/meta）→ 离线跑 signals+engine+build_report
#       → 抽 MODES/MODES_BB → state/payload；不联网抓取（抓取是数据链路职责）。
# 完成后 dispatch build-publish 组装发布。
#
# 个性化(selected) 的真实数据由 build-publish 的 Day-1 转发(stock-factor data/) 提供，本链路不重复。

on:
  schedule:
    - cron: '5 9 * * 1-5'        # 北京 17:05 盘后（数据链 16:30→verify 之后）
  repository_dispatch:            # 数据链 verify 成功后唤醒
  workflow_dispatch:
    inputs:
      skip_blackbox:
        description: '跳过 LightGBM 黑盒（省时）'
        type: boolean
        default: false

concurrency:
  group: state-commit             # 代码仓 state 提交单独一组，排队不取消（§4.5）
  cancel-in-progress: false

permissions:
  contents: write                 # 提交 state/payload
  actions: write                  # dispatch build-publish

jobs:
  shortterm:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # 与 quant-lab daily 同量级（全量回测）
    steps:
      - uses: actions/checkout@v4   # quant-hub 自身（common/ + tools/ + state/）

      - name: 检出 quant-lab（含 data/kline ~280MB + data/meta 已 commit 件）
        uses: actions/checkout@v4
        with:
          repository: andy-develop/quant-lab
          path: src/quant-lab
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'    # quant-lab 生产版本（pandas==3.0.5 / numpy==2.5.2）

      - name: 安装 quant-lab 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/quant-lab/requirements.txt

      - name: 跑短线计算链 → 抽 payload + 回测摘要/明细
        run: |
          # Q3：摘要入 state/（git 提交）；明细日快照导 /tmp/bt_detail，由下一 step 推数据仓
          ARGS="--qlab src/quant-lab --out state/payload --summary-out state/shortterm/backtest_summary.json --detail-out /tmp/bt_detail"
          [ "${{ github.event.inputs.skip_blackbox }}" = "true" ] && ARGS="$ARGS --skip-blackbox"
          python -m tools.run_shortterm $ARGS

      - name: 写 runlog（§3.1，供 repo-health 巡检）
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from tools.runlog import write_runlog
          files = sorted(Path("state/payload").glob("quant-lab.*.json"))
          write_runlog(Path("state"), "shortterm",
                       stages={"strategy_pm": "ok", "payload_files": len(files)},
                       trigger="schedule")
          print(f"runlog: shortterm（{len(files)} 个 payload）")
          EOF

      - name: 提交 state/（payload + runlog + 摘要，carry-forward 留档）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "短线 state 无变化，跳过提交"
          else
            git commit -m "strategy(shortterm): 自产 payload + runlog + 回测摘要 $(date -u +'%F %H:%M') UTC [run ${{ github.run_number }}]"
            git pull --rebase --autostash || true
            git push
          fi

      # Q3：回测明细日快照入数据仓（data/state/shortterm/backtest/YYYY-MM-DD/），
      # 摘要入代码仓 state/（上一 step），明细只入数据仓（~700K/日，不进代码仓）。
      # DATA_REPO_TOKEN = fine-grained PAT（写 quant-hub-data，见 docs/handoff §数据链）。
      - name: 回测明细快照推数据仓（data/state/shortterm/backtest/<data_date>/）
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          BT=/tmp/bt_detail
          if [ ! -d "$BT" ] || [ -z "$(ls -A "$BT")" ]; then
            echo "无回测明细（--detail-out 空或全缺），跳过数据仓推送"
            exit 0
          fi
          # 明细目录按摘要 data_date（北京数据日）命名；摘要缺失则用北京今日
          DATA_DATE=$(python3 -c 'import json;print(json.load(open("state/shortterm/backtest_summary.json",encoding="utf-8")).get("data_date") or "")')
          [ -n "$DATA_DATE" ] || DATA_DATE=$(TZ=Asia/Shanghai date +%F)
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/andy-develop/quant-hub-data.git" data-repo
          mkdir -p "data-repo/data/state/shortterm/backtest/$DATA_DATE"
          cp -f "$BT"/* "data-repo/data/state/shortterm/backtest/$DATA_DATE/"
          cd data-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/state/shortterm/backtest
          if git diff --cached --quiet; then
            echo "回测明细无变化（同日重跑幂等），跳过数据仓提交"
          else
            git commit -m "data(shortterm): $DATA_DATE 回测明细快照 [run ${{ github.run_number }}]"
            git pull --rebase --autostash || true
            git push
          fi

      # build-publish 由其 workflow_run 触发器在本 workflow 完成后自动唤醒（无需显式 dispatch，
      # 否则会触发两个 build-publish 并发竞争 state/payload 导致 rebase 冲突）。
