name: ci

# 合并仓的守门 CI：契约/聚合/门禁/限流/前端隔离/payload/发布状态机
# 数据流水线（每日行情）在 quant-hub-data 就位前不进 CI —— 见 docs/落地手册.md §8

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r common/requirements.txt
          pip install pytest

      - name: 单元测试（243 项：契约/日历/聚合/门禁/限流/事故回归/前端/payload/发布）
        run: python -m pytest tests/ -q

      - name: 事故回归必须全量执行（禁止 skip）
        run: python -m pytest tests/incident/ -q --strict-markers

  build-page:
    # 三仓检出 -> 单页壳构建冒烟（不注入真实数据，占位符路径）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检出三仓最新代码
        uses: actions/checkout@v4
        with:
          repository: andy-develop/quant-lab
          path: src/quant-lab
      - uses: actions/checkout@v4
        with:
          repository: andy-develop/red-dividend-strategy
          path: src/red-dividend-strategy
      - uses: actions/checkout@v4
        with:
          repository: andy-develop/stock-factor-engine
          path: src/stock-factor-engine

      - name: 构建单页壳（冒烟）
        run: python -m web.build --src src --out dist/index.html

      - name: 冒烟断言
        run: |
          python - <<'PY'
          import re, sys
          s = open("dist/index.html", encoding="utf-8").read()
          checks = {
            "三域作用域根": all(f'id="app-{d}"' in s for d in ("quant-lab","etf","stock")),
            "无 CDN 依赖": "cdn.jsdelivr.net" not in s,
            "导航齐全": all(f'id="qh-tab-{d}"' in s for d in ("quant-lab","etf","stock")),
            "无死规则": not re.search(r'#app-[\w-]+ #app-[\w-]+\{', s),
          }
          for k, v in checks.items():
              print(f"  {k}: {'OK' if v else 'FAIL'}")
          if not all(checks.values()):
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: page-shell
          path: dist/index.html
