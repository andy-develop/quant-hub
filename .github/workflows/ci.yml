name: ci

# 合并仓守门 CI：
#   ① test       —— 合并层基础设施 243 项（契约/日历/聚合/门禁/限流/事故回归/前端/payload/发布）
#   ② domains    —— 三域策略代码各自独立进程 + 独立依赖跑测试（方案 §4.4 matrix + §7.2 Phase-1 门禁）
#   ③ build-page —— 单页壳自包含构建冒烟（读 domains/，不再检出三个老仓）
# 数据流水线（每日行情）在 quant-hub-data 就位前不进 CI —— 见 docs/落地手册.md §8

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r common/requirements.txt
          pip install pytest

      - name: 合并层单元测试（契约/日历/聚合/门禁/限流/事故回归/前端/payload/发布）
        run: python -m pytest tests/ -q

      - name: 事故回归必须全量执行（禁止 skip）
        run: python -m pytest tests/incident/ -q --strict-markers

  domains:
    # 三域策略代码：每域一个独立进程 + 独立依赖版本（方案 §4.4）。
    # 独立进程是硬要求 —— shortterm 与 etf 各自都有 engine.py/signals.py 等同名模块，
    # 同一 pytest 进程内一起收集会让 `import engine` 命中错误的域。
    name: domains-${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 短线（quant-lab）：产物依赖测试在缺 data/ 时干净 skip；核心回归照常跑。
          # 生产运行时是 py3.13 + pandas==3.0.5，但测试门禁用兼容性更好的版本以保证 CI 稳定，
          # 数据流水线（quant-hub-data）才用 pinned env。
          - domain: shortterm
            python-version: '3.11'
            deps: 'numpy>=1.26 pandas>=2.2 pyarrow>=15 requests pytest'
          # ETF（red-dividend-strategy）：版本上限锁定（见其 requirements.txt 注释）
          - domain: etf
            python-version: '3.11'
            deps: 'pandas>=2.0,<2.3 numpy>=1.24,<2.3 pytest'
          # 个性化选股（stock-factor-engine）：纯标准库
          - domain: selected
            python-version: '3.11'
            deps: 'pytest'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装本域依赖
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.deps }}

      - name: 跑本域测试（独立进程）
        run: python -m pytest domains/${{ matrix.domain }}/tests -q

  build-page:
    # 单页壳自包含构建：直接读合并后的 domains/，不再检出三个老仓（方案 §1 分仓 + §7.1）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建单页壳（自包含，读 domains/）
        run: |
          # web.build + web.shell.scope 仅用标准库，无需 pandas/numpy
          python -m web.build --src domains --out dist/index.html

      - name: 冒烟断言
        run: |
          python - <<'PY'
          import re, sys
          s = open("dist/index.html", encoding="utf-8").read()
          checks = {
              "三域作用域根": all(f'id="app-{d}"' in s for d in ("quant-lab","etf","stock")),
              "无 CDN 依赖": "cdn.jsdelivr.net" not in s,
              "导航齐全": all(f'id="qh-tab-{d}"' in s for d in ("quant-lab","etf","stock")),
              "无死规则": not re.search(r'#app-[\w-]+ #app-[\w-]+\{', s),
              "echarts 已内联": "echarts" in s,
          }
          for k, v in checks.items():
              print(f"  {k}: {'OK' if v else 'FAIL'}")
          if not all(checks.values()):
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: page-shell
          path: dist/index.html
