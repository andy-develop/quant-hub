name: data-retention

# §4.2 封存与过期 + §4.5 体积治理：每周日 03:00（CST）跑一次。
# - 过期 = 删整分区目录（stock 730 交易日 / etf 2430 交易日 / index 不过期）
# - 删前归档：将删分区打包 → Release asset（后悔药，一次性）
# - 体积报告写 state/data/runlog + 更新 manifest
# 不跑数据抓取，只做封存/过期/报告；幂等，可 workflow_dispatch 补跑。

on:
  schedule:
    - cron: "0 19 * * 6"   # 周日 03:00 CST = 周六 19:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyarrow pandas --quiet

      - name: 归档将删分区（幂等：同月归档已存在则跳过）
        run: python3 tools/retention.py --archive-out /tmp/arch

      - name: 上传归档到 Release（后悔药，data-expired-YYYYMM.tar.zst）
        if: hashFiles('/tmp/arch/*.tar.zst') != ''
        run: |
          ARC=$(ls /tmp/arch/*.tar.zst | head -1)
          TAG=$(basename "$ARC" .tar.zst)
          gh release create "$TAG" "$ARC" \
            --title "过期数据归档 ${TAG}" \
            --notes "retention 删前归档：被删分区的唯一后悔药。retention 不可逆。" || \
            gh release upload "$TAG" "$ARC" || true

      - name: 实删过期分区（--require-release 门禁 + --force 跳过确认）
        run: python3 tools/retention.py --apply --require-release --force

      - name: 体积报告写入 runlog（§3.1）
        run: |
          python3 - <<'EOF'
          import sys, json, subprocess
          from pathlib import Path
          sys.path.insert(0, ".")
          from tools.runlog import write_runlog
          # 复用 retention 的体积报告输出（简单重算）
          out = subprocess.run(
              [sys.executable, "tools/retention.py", "--dry-run"],
              capture_output=True, text=True).stdout
          p = write_runlog(Path("state"), "data-retention",
                           stages={"retention": out}, trigger="schedule")
          print("runlog:", p)
          EOF

      - name: 提交状态中间态
        run: |
          git config user.name "quant-hub bot"
          git config user.email "actions@github.com"
          git add state/ tools/ web/ || true
          git commit -m "retention: 周度封存+过期+体积报告 $(date +%F)" || echo "无变化可提交"
          git push || echo "push 失败（由下个 run 处理）"
